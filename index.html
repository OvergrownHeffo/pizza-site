<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Johnny Gios Style Pizza</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="hero">
    <h1>THE PIZZA CO.</h1>
    <p>Bold pizza. Simple ingredients. No nonsense.</p>
    <a href="#menu" class="btn">View Menu</a>
  </header>

  <section id="menu" class="section">
    <h2>Menu</h2>

    <div class="grid">
      <div class="card">
        <h3>Margherita</h3>
        <p>Tomato, mozzarella, basil</p>
      </div>

      <div class="card">
        <h3>Spicy Pepperoni</h3>
        <p>Pepperoni, chilli oil, mozzarella</p>
      </div>

      <div class="card">
        <h3>Truffle Mushroom</h3>
        <p>Mushroom, truffle cream, parmesan</p>
      </div>
    </div>
  </section>

  <section class="section dark">
    <h2>Locations</h2>
    <p>Melbourne • Sydney • Brisbane</p>
  </section>

  <footer>
    <p>© 2026 The Pizza Co.</p>
  </footer>

</body>
</html>
